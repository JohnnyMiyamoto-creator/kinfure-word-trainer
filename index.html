<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#173b5e"><link rel="manifest" href="manifest.json"><title>金フレ単語トレーナー</title><style>
:root{--navy:#173b5e;--blue:#2463a6;--bg:#f3f6fa;--line:#dce4ed}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#1c2733;font-family:system-ui,-apple-system,sans-serif}header{background:var(--navy);color:white;padding:20px}h1{font-size:1.2rem;margin:0 0 5px}header p{margin:0;font-size:.85rem;color:#dce8f5}main{max-width:620px;margin:auto;padding:15px}.panel{background:white;border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px;box-shadow:0 2px 8px #132c4510}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{background:#f5f8fc;border-radius:12px;padding:10px 5px;text-align:center}.stat strong{display:block;font-size:1.4rem;color:var(--navy)}.stat span,label,.small{font-size:.78rem;color:#687789}.controls{display:grid;grid-template-columns:1fr 1fr;gap:10px}label{display:block;margin-bottom:5px}select{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;background:white;font:inherit}.progress{height:7px;background:#e7edf4;border-radius:20px;margin-top:12px;overflow:hidden}.bar{height:100%;background:var(--blue);width:0}.kicker{display:flex;justify-content:space-between;color:#687789;font-size:.82rem}.wordbox{min-height:175px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}.word{font-size:clamp(2rem,9vw,3rem);font-weight:750;overflow-wrap:anywhere}.range{font-size:.8rem;color:#687789;margin-top:12px}.prompt{text-align:center;color:#687789;font-size:.9rem}.buttons{display:grid;grid-template-columns:1fr 1fr;gap:10px}.btn{border:0;border-radius:12px;padding:14px 8px;font:inherit;font-weight:700;cursor:pointer}.btn:disabled{opacity:.45}.known{background:#e2f4e9;color:#17653c}.unknown{background:#fde9e8;color:#9b2d34}.next{background:var(--navy);color:white;width:100%;margin-top:10px}.answer{display:none;text-align:center;background:#f5f8fc;border-radius:12px;padding:14px;margin-top:14px;font-size:1.05rem;line-height:1.6}.answer.show{display:block}.s </style></head><body><header><h1>金フレ単語トレーナー</h1><p>TOEIC 900点を目指す、弱点単語の復習アプリ</p></header><main>
<section class="panel"><div class="stats"><div class="stat"><strong id="total">112</strong><span>登録単語</span></div><div class="stat"><strong id="knownCount">0</strong><span>わかる記録</span></div><div class="stat"><strong id="unknownCount">0</strong><span>要復習</span></div></div><div class="progress"><div class="bar" id="bar"></div></div><p class="small" id="progressText">回答済み 0 / 112語</p></section>
<section class="panel controls"><div><label for="range">出題範囲</label><select id="range"><option value="all">全範囲（112語）</option><option value="1-100">1〜100番</option><option value="101-200">101〜200番</option><option value="201-300">201〜300番</option><option value="301-400">301〜400番</option><option value="401-500">401〜500番</option></select></div><div><label for="mode">出題モード</label><select id="mode"><option value="all">すべて</option><option value="unknown">要復習だけ</option><option value="unseen">未回答だけ</option><option value="known">わかる記録だけ</option></select></div></section>
<section class="panel"><div class="kicker"><span id="counter"></span><span id="session">今回：0語</span></div><div class="wordbox"><div class="word" id="word">revenue</div><div class="range" id="wordRange"></div></div><p class="prompt" id="prompt">意味を思い出してからボタンを押してください。</p><div class="buttons"><button class="btn known" id="knownBtn">✓ わかる</button><button class="btn unknown" id="unknownBtn">× わからない</button></div><div class="answer" id="answer"><strong id="meaning"></strong><div class="small" id="feedback"></div></div><button class="btn next" id="nextBtn" disabled>次の単語へ →</button></section>
<section class="panel"><details><summary>学習記録のバックアップ・リセット</summary><p class="small">記録はこのブラウザ内に保存されます。端末変更やブラウザのデータ削除に備え、定期的にバックアップしてください。</p><div class="row"><button class="btn secondary" id="export">記録をバックアップ</button><button class="btn secondary" id="import">バックアップを復元</button><input id="file" type="file" accept="application/json" hidden><button class="btn secondary" id="reset">記録をリセット</button></div><p class="small" id="message"></p></details></section></main><footer>学習記録は端末内に保存され、外部サーバーへ送信されません。</footer>
<script>const WORDS=[{"range": "1-100", "word": "expect", "meaning": "期待する、予期する"}, {"range": "1-100", "word": "firm", "meaning": "会社、堅固な"}, {"range": "1-100", "word": "application", "meaning": "申請、応募、適用"}, {"range": "1-100", "word": "contract", "meaning": "契約、契約する"}, {"range": "1-100", "word": "candidate", "meaning": "候補者"}, {"range": "1-100", "word": "state", "meaning": "状態、州、述べる"}, {"range": "1-100", "word": "agency", "meaning": "代理店、機関"}, {"range": "1-100", "word": "executive", "meaning": "役員、幹部"}, {"range": "1-100", "word": "register", "meaning": "登録する"}, {"range": "1-100", "word": "bill", "meaning": "請求書、法案"}, {"range": "1-100", "word": "hire", "meaning": "雇う"}, {"range": "1-100", "word": "conduct", "meaning": "行う、実施する"}, {"range": "1-100", "word": "mention", "meaning": "言及する"}, {"range": "101-200", "word": "personnel", "meaning": "職員、人事"}, {"range": "101-200", "word": "benefit", "meaning": "利益、恩恵、役に立つ"}, {"range": "101-200", "word": "participate", "meaning": "参加する"}, {"range": "101-200", "word": "host", "meaning": "主催する、主催者"}, {"range": "101-200", "word": "impress", "meaning": "感銘を与える"}, {"range": "101-200", "word": "representative", "meaning": "代表者、担当者"}, {"range": "101-200", "word": "property", "meaning": "財産、所有物、不動産"}, {"range": "101-200", "word": "inquire", "meaning": "問い合わせる"}, {"range": "101-200", "word": "highly", "meaning": "非常に、高く"}, {"range": "101-200", "word": "intended", "meaning": "意図された、予定された"}, {"range": "101-200", "word": "brochure", "meaning": "パンフレット"}, {"range": "101-200", "word": "distribute", "meaning": "配布する"}, {"range": "101-200", "word": "refund", "meaning": "払い戻し、返金する"}, {"range": "101-200", "word": "council", "meaning": "評議会、協議会"}, {"range": "101-200", "word": "frequent", "meaning": "頻繁な"}, {"range": "101-200", "word": "admission", "meaning": "入場、入学、入場料"}, {"range": "101-200", "word": "nearly", "meaning": "ほとんど、約"}, {"range": "201-300", "word": "reasonable", "meaning": "妥当な、手頃な"}, {"range": "201-300", "word": "figure", "meaning": "数字、  {"range": "301-400", "word": "committed", "meaning": "熱心に取り組んでいる、献身的な"}, {"range": "301-400", "word": "existing", "meaning": "既存の"}, {"range": "301-400", "word": "appoint", "meaning": "任命する"}, {"range": "301-400", "word": "eager", "meaning": "熱望して、～したがっている"}, {"range": "301-400", "word": "ease", "meaning": "容易さ、和らげる"}, {"range": "301-400", "word": "fairly", "meaning": "かなり、公平に"}, {"range": "301-400", "word": "occasionally", "meaning": "時折"}, {"range": "301-400", "word": "practical", "meaning": "実用的な、現実的な"}, {"range": "401-500", "word": "supervisor", "meaning": "監督者、上司"}, {"range": "401-500", "word": "ensure", "meaning": "確実にする"}, {"range": "401-500", "word": "notify", "meaning": "通知する"}, {"range": "401-500", "word": "eligible", "meaning": "資格のある、対象となる"}, {"range": "401-500", "word": "complimentary", "meaning": "無料の、称賛の"}, {"range": "401-500", "word": "extensive", "meaning": "広範囲の、大規模な"}, {"range": "401-500", "word": "promotional", "meaning": "販促の、宣伝の"}, {"range": "401-500", "word": "imply", "meaning": "暗示する、意味する"}, {"range": "401-500", "word": "banquet", "meaning": "宴会"}, {"range": "401-500", "word": "certificate", "meaning": "証明書、資格証明書"}, {"range": "401-500", "word": "renowned", "meaning": "有名な、名高い"}, {"range": "401-500", "word": "appropriate", "meaning": "適切な"}, {"range": "401-500", "word": "ingredient", "meaning": "材料、成分"}, {"range": "401-500", "word": "prior", "meaning": "前の、事前の"}, {"range": "401-500", "word": "merger", "meaning": "合併"}, {"range": "401-500", "word": "quarterly", "meaning": "四半期ごとの、年4回の"}, {"range": "401-500", "word": "extended", "meaning": "延長された、拡張された"}, {"range": "401-500", "word": "architect", "meaning": "建築家"}, {"range": "401-500", "word": "sculpture", "meaning": "彫刻"}, {"range": "401-500", "word": "itinerary", "meaning": "旅行日程"}, {"range": "401-500", "word": "directory", "meaning": "名簿、住所録、案内簿"}, {"range": "401-500", "word": "expire", "meaning": "期限が切れる"}, {"range": "401-500", "word": "patron", "meaning": "顧客、後援者"}, {"range": "401-500", "word": "payroll", "meaning": "給与、給与支払名簿"}, {"range": "401-500", "word": "qualified", "meaning": "資格のある、適任の"}, {"range": "401-500", "word": "appliance", "meaning": "電化製品、器具"}, {"range": "401-500", "word": "contribute", "meaning": "貢献する、寄付する"}, {"range": "401-500", "word": "strategy", "meaning": "戦略"}, {"range": "401-500", "word": "exceptional", "meaning": "並外れた、例外的な"}, {"range": "401-500", "word": "luncheon", "meaning": "昼食会"}, {"range": "401-500", "word": "specify", "meaning": "明示する、具体的に指定する"}, {"range": "401-500", "word": "venue", "meaning": "会場"}, {"range": "401-500", "word": "circulation", "meaning": "流通、循環、発行部数"}, {"range": "401-500", "word": "completion", "meaning": "完成、完了"}, {"range": "401-500", "word": "relevant", "meaning": "関連のある"}, {"range": "401-500", "word": "thorough", "meaning": "徹底的な、綿密な"}, {"range": "401-500", "word": "accommodations", "meaning": "宿泊施設"}, {"range": "401-500", "word": "substantial", "meaning": "かなりの、相当な"}, {"range": "401-500", "word": "coverage", "meaning": "報道、補償、適用範囲"}, {"range": "401-500", "word": "refreshment", "meaning": "軽食、飲み物"}, {"range": "401-500", "word": "revenue", "meaning": "収益、歳入"}];const KEY='kinfureTrainerProgressV1';let progress={};try{progress=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){}let queue=[],idx=0,answered=false,sk=0,su=0;const $=id=>document.getElementById(id);function save(){localStorage.setItem(KEY,JSON.stringify(progress));stats()}function stats(){let k=0,u=0,a=0;WORDS.forEach(w=>{let p=progress[w.word];if(p){a++;if(p.last==='known')k++;if(p.last==='unknown')u++}});$('total').textContent=WORDS.length;$('knownCount').textContent=k;$('unknownCount').textContent=u;$('bar').style.width=(a/WORDS.length*100)+'%';$('progressText').textContent=`回答済み ${a} / ${WORDS.length} 語。記録はこの端末に保存されます。`}function filtered(){let r=$('range').value,m=$('mode').value;return WORDS.filter(w=>{if(r!=='all'&&w.range!==r)return false;let p=progress[w.word];if(m==='unknown')return p&&p.last==='unknown';if(m==='known')return p&&p.last==='known';if(m==='unseen')return !p;return true})}function shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function start(){queue=shuffle(filtered());idx=0;sk=su=0;show()}function show(){answered=false;$('answer').classList.remove('show');$('knownBtn').disabled=$('unknownBtn').disabled=false;$('nextBtn').disabled=true;$('prompt').textContent='意味を思い出してからボタンを押してください。';$('session').textContent=`今回：${sk+su}語（わかる ${sk} / 要復習 ${su}）`;if(!queue.length){$('word').textContent='出題する単語がありません';$('wordRange').textContent='出題範囲やモードを変更してください';$('counter').textContent='0語';$('knownBtn').disabled=$('unknownBtn').disabled=true;$('prompt').textContent='別の出題モードや範囲を選んでください。';stats();return}if(idx>=queue.length){$('word').textContent='おつかれさまでした！';$('wordRange').textContent=`今回 ${queue.length} 語を出題しました`;$('counter').textContent=`${queue.length} / ${queue.length}`;$('prompt').textContent='出題条件を変えると次のセットを始められます。';$('knownBtn').disabled=$('unknownBtn').disabled=true;$('nextBtn').disabled=true;stats();return}let w=queue[idx];$('word').textContent=w.word;$('wordRange').textContent='金フレ '+w.range.replace('-','〜')+'番';$('counter').textContent=`${idx+1} / ${queue.length}`;stats()}function answer(choice){if(answered||idx>=queue.length)return;answered=true;let w=queue[idx],p=progress[w.word]||{};progress[w.word]={last:choice,lastReviewed:new Date().toISOString(),attempts:(p.attempts||0)+1,knownCount:(p.knownCount||0)+(choice==='known'?1:0),unknownCount:(p.unknownCount||0)+(choice==='unknown'?1:0)};if(choice==='known')sk++;else su++;save();$('meaning').textContent=w.meaning;$('feedback').textContent=choice==='known'?'「わかる」と記録しました。':'要復習として記録しました。後でもう一度確認しましょう。';$('answer').classList.add('show');$('prompt').textContent='答えを確認してから次へ進みましょう。';$('knownBtn').disabled=$('unknownBtn').disabled=true;$('nextBtn').disabled=false;$('session').textContent=`今回：${sk+su}語（わかる ${sk} / 要復習 ${su}）`}$('knownBtn').onclick=()=>answer('known');$('unknownBtn').onclick=()=>answer('unknown');$('nextBtn').onclick=()=>{if(idx<queue.length){idx++;show()}};$('range').onchange=start;$('mode').onchange=start;$('export').onclick=()=>{let b=new Blob([JSON.stringify({version:1,exportedAt:new Date().toISOString(),progress},null,2)],{type:'application/json'});let a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='kinfure-progress-backup.json';a.click();URL.revokeObjectURL(a.href);$('message').textContent='バックアップを保存しました。'};$('import').onclick=()=>$('file').click();$('file').onchange=async e=>{let f=e.target.files[0];if(!f)return;try{let o=JSON.parse(await f.text()),p=o.progress||o;if(typeof p!=='object'||Array.isArray(p))throw Error();if(confirm('現在の記録をバックアップの内容で置き換えますか？')){progress=p;save();start();$('message').textContent='バックアップを復元しました。'}}catch(e){alert('バックアップを読み込めませんでした。')}e.target.value=''};$('reset').onclick=()=>{if(confirm('すべての学習記録を削除します。続けますか？')){progress={};save();start();$('message').textContent='記録をリセットしました。'}};if('serviceWorker'in navigator&&location.protocol.startsWith('http'))addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js').catch(()=>{}));start();</script></body></html>
