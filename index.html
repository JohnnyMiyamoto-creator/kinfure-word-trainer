const KEY = "kinfureTrainer395_v1";
const $ = id => document.getElementById(id);
let records = {};
try { records = JSON.parse(localStorage.getItem(KEY) || "{}"); } catch(e) { records = {}; }
let queue = [...WORDS], pos = 0, revealed = false;
const ranges = [...new Set(WORDS.map(x=>x.range))];
for (const r of ranges) { const o=document.createElement("option"); o.value=r; o.textContent=r+"番"; $("range").appendChild(o); }
function save(){localStorage.setItem(KEY,JSON.stringify(records)); renderStats();}
function current(){return queue[pos] || WORDS[0];}
function getStatus(w){return records[w.word]?.status || "unseen";}
function renderStats(){
 const known=WORDS.filter(w=>getStatus(w)==="yes").length;
 const weak=WORDS.filter(w=>getStatus(w)==="no"||getStatus(w)==="later"||getStatus(w)==="unseen").length;
 const answered=WORDS.filter(w=>getStatus(w)!=="unseen").length;
 $("total").textContent=WORDS.length;$("known").textContent=known;$("weakCount").textContent=weak;
 $("progress").style.width=(known/WORDS.length*100)+"%";
 $("summary").textContent=`記録済み ${answered}語 / ${WORDS.length}語　｜　正答率ではなく「即答できた語」の数を表示`;
}
function makeQueue(forceWeak=false, shuffle=false){
 const r=$("range").value, mode=forceWeak?"weak":$("mode").value;
 queue=WORDS.filter(w=>(r==="all"||w.range===r) && (mode==="all" || (mode==="weak" ? getStatus(w)!=="yes" : getStatus(w)==="unseen")));
 if(shuffle) queue.sort(()=>Math.random()-.5);
 pos=0; render();
}
function render(){
 if(!queue.length){$("word").textContent="対象の単語はありません";$("meaning").textContent="範囲・出題条件を変更してください。";$("counter").textContent="0 / 0";$("show").disabled=true;$("yes").disabled=true;$("no").disabled=true;$("later").disabled=true;$("next").disabled=true;return;}

 $("meaning").textContent=revealed?w.meaning:"意味を思い出してから「意味を表示」";revealed=false;

}
function advance(status){
 if(!queue.length)return;
 const w=current();
 if(status) records[w.word]={status, updatedAt:new Date().toISOString()};
 save(); pos++;
 if(pos>=queue.length){$("word").textContent="このセットは終了！";$("meaning").textContent="お疲れさまでした。苦手だけ復習するか、別の範囲を選べます。";$("counter").textContent=`${queue.length} / ${queue.length}`;["show","yes","no","later","next"].forEach(id=>$(id).disabled=true);return;}
 render();
}
$("start").onclick=()=>makeQueue(false,false);
$("shuffle").onclick=()=>makeQueue(false,true);
$("review").onclick=()=>makeQueue(true,true);
$("show").onclick=()=>{revealed=true;$("meaning").textContent=current().meaning;$("show").textContent="意味を表示済み";};
$("yes").onclick=()=>advance("yes");$("no").onclick=()=>advance("no");$("later").onclick=()=>advance("later");$("next").onclick=()=>advance(null);
$("export").onclick=()=>{const blob=new Blob([JSON.stringify({app:"kinfure-word-trainer",version:1,records},null,2)],{type:"application/json"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="kinfure-trainer-backup.json";a.click();URL.revokeObjectURL(a.href);};
$("importFile").onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const obj=JSON.parse(await f.text());if(!obj.records||typeof obj.records!=="object")throw Error();records={...records,...obj.records};save();alert("復元しました。");render();}catch(err){alert("バックアップファイルを読み込めませんでした。");}e.target.value="";};
$("reset").onclick=()=>{if(confirm("学習記録をすべて削除します。よろしいですか？")){records={};save();makeQueue();}};
function renderList(){
 const by={};for(const w of WORDS)(by[w.range]??=[]).push(w);
 $("list").innerHTML=Object.entries(by).map(([r,ws])=>`<details><summary>${r}番（${ws.length}語）</summary><ul>${ws.map(w=>`<li><b>${w.word}</b> — ${w.meaning}</li>`).join("")}</ul></details>`).join("");
